# 分割設定サンプル: Web / API ヘルスチェック
# verify_ssl: 公開サイトは true、自己署名は false を検討。
web_health_checks:
  targets:
    # --- 公開 Web ---
    - name: "corporate-website"
      url: "https://www.example.com"
      timeout: 30
      verify_ssl: true

    # --- REST API ---
    - name: "rest-api-health"
      url: "https://api.example.com/v1/health"
      timeout: 10
      verify_ssl: true
      expected_status: [200, 204]

    - name: "rest-api-ready"
      url: "https://api.example.com/v1/ready"
      timeout: 10
      verify_ssl: true

    # --- 内部（自己署名） ---
    - name: "internal-dashboard"
      url: "https://dashboard.internal.local"
      timeout: 15
      verify_ssl: false

    # --- HTTP（非 SSL） ---
    - name: "monitoring-endpoint"
      url: "http://monitor.internal.local:8080/status"
      timeout: 5
      verify_ssl: false
