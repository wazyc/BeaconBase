# 分割設定サンプル: 実行パラメータ
# 省略時はコード側のデフォルト値を使う。必要になった項目だけ書けばよい。
settings:
  retry_count: 3
  retry_delay: 5
  timeout: 30
  max_workers: 5
  ping_timeout: 5
  ssh_timeout: 15
  log_summary_max_lines: 80
  # 日次 JSON の保持日数。0 で無制限
  retain_days: 14
  # ダッシュボードの自動更新秒
  dashboard_refresh_seconds: 30
  # 常駐モード（serve.py / docker compose）の監視間隔（秒）
  check_interval: 300
  # 指定すると監視ログをファイルにも残す
  # log_file: "./output/beaconbase.log"
