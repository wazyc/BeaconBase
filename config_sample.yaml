# BeaconBase 監視システム設定ファイル（サンプル）
#
# 使用方法:
#   1. このファイルをconfig.yamlとしてコピー
#   2. 各セクションを環境に合わせて編集
#   3. python monitor.py -c config.yaml で実行
#
# 設定を複数YAMLに分ける場合:
#   - メインYAMLのルートで includes_dir: にディレクトリ相対パス（文字列）を書きます。
#   - そのディレクトリ直下の *.yaml / *.yml がファイル名ソート順でマージされます。
#   - 断片はすべて「メイン設定ファイルと同じディレクトリ」配下に置きます（セキュリティ上の制限）。
#   - 辞書は再帰的にマージ、同名のリストは連結、それ以外は後から読んだ値が優先されます。
#   - 具体例: 同梱の config_sample_split_entry.yaml と config_sample.d/ を参照。
#   - 詳細: docs/configuration.md

# ============================================================
# ストレージ設定
# ============================================================
storage:
  # 監視結果の保存先ディレクトリ（絶対パスを推奨）
  # Windows: "C:/monitoring/output" or "C:\\monitoring\\output"
  # Linux/Mac: "/home/user/monitoring/output"
  output_folder: "./output"

# ============================================================
# デフォルトSSH設定
# ============================================================
# 各サーバー設定で個別のSSH情報が指定されていない場合、この設定が使用されます。
default_ssh:
  # SSHログインユーザー名
  username: "monitoring_user"

  # SSH秘密鍵のパス（パーミッションは600に設定してください）
  # Windows: "C:/Users/username/.ssh/id_rsa"
  # Linux/Mac: "~/.ssh/id_rsa" or "/home/user/.ssh/id_rsa"
  key_path: "~/.ssh/id_rsa"

  # SSHポート番号（デフォルト: 22）
  port: 22

# ============================================================
# ログ収集設定
# ============================================================
log_collection:
  # ログ収集後にサーバー上のログファイルを削除するかどうか
  # true: 収集後に削除（ディスク容量節約）
  # false: 収集後も保持（安全性重視）
  delete_after_collection: false
  
  servers:
    # --- Webサーバーの例 ---
    - name: "web-server-01"
      host: "192.168.1.100"
      # 個別のSSH設定（オプション、指定しない場合はdefault_sshを使用）
      ssh_username: "webadmin"
      ssh_key_path: "~/.ssh/web_server_key"
      ssh_port: 22
      # 収集するログファイルのパスリスト（サーバー上の絶対パス）
      log_paths:
        - "/var/log/nginx/access.log"
        - "/var/log/nginx/error.log"
        - "/var/log/application/app.log"

    # --- アプリケーションサーバーの例 ---
    - name: "app-server-01"
      host: "192.168.1.101"
      # default_ssh設定を使用する場合は、個別設定を省略可能
      log_paths:
        - "/var/log/myapp/application.log"
        - "/var/log/myapp/error.log"

    # --- カスタムポートを使用するサーバーの例 ---
    - name: "db-server-01"
      host: "192.168.1.102"
      ssh_username: "dbadmin"
      ssh_key_path: "~/.ssh/db_server_key"
      ssh_port: 2222  # カスタムSSHポート
      log_paths:
        - "/var/log/postgresql/postgresql.log"
        - "/var/log/postgresql/error.log"

# ============================================================
# Ping監視設定
# ============================================================
# ネットワーク機器やサーバーの死活監視
ping_targets:
  # --- ネットワーク機器の例 ---
  - name: "main-gateway"
    host: "192.168.1.1"

  - name: "core-switch"
    host: "192.168.1.2"

  # --- サーバーの例 ---
  - name: "web-server"
    host: "192.168.1.100"

  - name: "app-server"
    host: "192.168.1.101"

  - name: "db-server"
    host: "192.168.1.102"

  # --- 外部サービスの例 ---
  - name: "dns-server"
    host: "8.8.8.8"

# ============================================================
# Dockerコンテナ監視設定
# ============================================================
docker_monitoring:
  servers:
    # --- Dockerホスト1の例 ---
    - host: "192.168.1.100"
      # SSH設定（オプション）
      ssh_username: "docker_user"
      ssh_key_path: "~/.ssh/docker_key"
      ssh_port: 22

      containers:
        # Webアプリケーションコンテナ（ヘルスチェック付き）
        - name: "nginx-proxy"
          type: "web"
          # コンテナ内部からアクセス可能なヘルスチェックURL
          health_check_url: "http://localhost:80/health"

        - name: "web-api"
          type: "web"
          health_check_url: "http://localhost:8080/api/health"

        # アプリケーションコンテナ（ヘルスチェック不要）
        - name: "background-worker"
          type: "application"

        # データベースコンテナ（ヘルスチェック不要）
        - name: "redis-cache"
          type: "database"

    # --- Dockerホスト2の例 ---
    - host: "192.168.1.101"
      containers:
        - name: "postgresql"
          type: "database"

        - name: "mongodb"
          type: "database"

# ============================================================
# Webページヘルスチェック設定
# ============================================================
web_health_checks:
  targets:
    # --- 公開Webサイトの例 ---
    - name: "corporate-website"
      url: "https://www.example.com"
      # リクエストタイムアウト（秒）
      timeout: 30
      # SSL証明書の検証（公開サイトはtrueを推奨）
      verify_ssl: true

    # --- REST APIエンドポイントの例 ---
    - name: "rest-api-health"
      url: "https://api.example.com/v1/health"
      timeout: 10
      verify_ssl: true

    # --- 内部サービスの例（自己署名証明書） ---
    - name: "internal-dashboard"
      url: "https://dashboard.internal.local"
      timeout: 15
      # 自己署名証明書を使用している場合はfalseに設定
      verify_ssl: false

    # --- HTTP（非SSL）エンドポイントの例 ---
    - name: "monitoring-endpoint"
      url: "http://monitor.internal.local:8080/status"
      timeout: 5
      verify_ssl: false

# ============================================================
# 設定のヒント
# ============================================================
#
# 1. パスの指定:
#    - 絶対パスの使用を推奨
#    - Windowsでは "/" または "\\" を使用可能
#    - "~" はホームディレクトリを表す
#
# 2. SSH鍵の設定:
#    - 鍵のパーミッションを600に設定（Linux/Mac）
#    - パスワード認証は非対応（鍵認証のみ）
#
# 3. Dockerコンテナのtype:
#    - web: Webサービス（health_check_url必須）
#    - application: アプリケーション
#    - database: データベース
#
# 4. セキュリティ:
#    - このファイルには機密情報を含めないこと
#    - Git管理する場合は.gitignoreに追加
#    - 本番環境では環境変数の使用を検討
#
# 5. テスト実行:
#    - 最初は少数の監視対象で動作確認
#    - 詳細ログを有効にして実行: python monitor.py -c config.yaml -v
#
